<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XIAOMI</title>

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox"></header>
    </div>

    <!-- 2. 메인영역 (div>main>section 삼중구조)-->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 시작페이지 영역: 일단 최종상태 기준으로  -->
         <!-- 시작페이지부터 라인업페이지까지는 포지션 픽스드, 100vh
          화면 세로 기준 (100vh = 전체 화면 높이) -->
         <section class="intro-page-part"></section>

        <!-- 2-2. 메인페이지 영역 -->
         <section class="main-page-part inbox"></section>

        <!-- 2-3. 서브페이지 영역 -->
         <section class="sub-page-part inbox"></section>

        <!-- 2-4. 라인업페이지 영역 -->
         <section class="lineup-part inbox"></section>

        <!-- 2-5. 메인홍보영상, 영상 등 영역 -->
         <section class="video-part inbox"></section>

        <!-- 2-6. 하이라이트기능 영역 -->
         <section class="highlight-part inbox"></section>

        <!-- 2-7. 프리미엄 영역 -->
         <section class="premium-intro-part inbox"></section>
        <!-- 2-8. 프리미엄 기능1 영역 -->
         <section class="premium-part1 inbox"></section>
        <!-- 2-9. 프리미엄 기능2 영역 -->
         <section class="premium-part2 inbox"></section>
        <!-- 2-10. 디자인 영역 -->
         <section class="design-intro-part inbox"></section>
        <!-- 2-11. 디자인 기능1 영역 -->
         <section class="design-part1 inbox"></section> 
        <!-- 2-12. 디자인 기능2 영역 -->
         <section class="design-part2 inbox"></section> 
         <!-- 2-13. 운동건강 영역 -->
         <section class="health-intro-part inbox"></section>
         <!-- 2-14. 운동건강 기능1 영역 -->
         <section class="health-part1 inbox"></section>
         <!-- 2-15. 운동건강 기능2 영역 -->
         <section class="health-part2 inbox"></section>
         <!-- 2-16. 운동건강 기능3 영역 -->
         <section class="health-part3 inbox"></section>
    

      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
  </body>
</html>
