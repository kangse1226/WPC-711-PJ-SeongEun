<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XIAOMI</title>

    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox"></header>
    </div>

    <!-- 2. 메인영역 (div>main>section 삼중구조)-->
    <div id="main-area">
      <main class="main-area">
        <!-- 2-1. 시작페이지 영역 -->
         <section class="intro-page-part"></section>

        <!-- 2-2. 메인페이지 영역 -->
         <section class="main-page-part inbox"></section>

        <!-- 2-3. 서브페이지 영역 -->
         <section class="sub-page-part inbox"></section>

        <!-- 2-4. 라인업페이지 영역 -->
         <section class="lineup-part inbox"></section>

        <!-- 2-5. 메인홍보영상, 영상 등 영역 -->
         <section class="video-part inbox"></section>

        <!-- 2-6. 하이라이트기능 영역 -->
         <section class="highlight-part inbox"></section>

        <!-- 2-7. 프리미엄, 디자인, 헬스 시작페이지 영역 -->
         <section class="premium-part inbox"></section>
        <!-- 2-8. 트렌디모델 영역 -->
         <section class="model-part inbox"></section>
        <!-- 2-9. 건강체크기능, 스포츠모드기능 영역 -->
         <section class="sport-box-part inbox"></section>
        <!-- 2-10. 시계 영역 -->
         <section class="watch101-part inbox"></section>

      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox"></footer>
    </div>
  </body>
</html>
