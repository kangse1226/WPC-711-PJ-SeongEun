<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaomi Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">mi</div>
    <nav>
      <ul>
        <li><a href="#">Smart Home</a></li>
        <li><a href="#">Wearable</a></li>
        <li><a href="#">Mobile</a></li>
        <li><a href="#">Lifestyle</a></li>
      </ul>
    </nav>
  </header>

  <main class="grid">
    <section class="card">
      <h3 class="label">BEST</h3>
      <div class="icon">
        <img src="smartwatch.svg" alt="Smartwatch">
      </div>
      <h2>Smartwatch</h2>
      <p>Premium smartwatch</p>
      <a href="#" class="btn">Learn more</a>
    </section>

    <section class="card">
      <h3 class="label">COOL SUMMER FESTIVAL</h3>
      <div class="icon">
        <img src="smartphone.svg" alt="Smartphone">
      </div>
      <h2>New smartphone</h2>
      <p>Limited-time offer</p>
      <a href="#" class="btn">Learn more</a>
    </section>

    <section class="card">
      <h3 class="label">EXCLUSIVE BENEFIT</h3>
      <div class="icon">
        <img src="member.svg" alt="Member exclusive">
      </div>
      <h2>Member exclusive</h2>
      <p>Special offers for members</p>
      <a href="#" class="btn">Learn more</a>
    </section>

    <section class="card">
      <h3 class="label">NEW</h3>
      <div class="icon">
        <img src="luxurywatch.svg" alt="Luxury watch">
      </div>
      <h2>Luxury watch</h2>
      <p>Modern design</p>
      <a href="#" class="btn">Learn more</a>
    </section>
  </main>
</body>
</html>
